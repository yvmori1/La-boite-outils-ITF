name: Déploiement du site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication à la fois, sans annuler celle déjà en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Construire le site
        run: mkdocs build

      # Copie du site lisible sans connexion (au dojang, par exemple) :
      # pages en .html, recherche intégrée, audio compris. Publiée en
      # hors-ligne.zip à la racine du site.
      - name: Construire la version hors ligne
        env:
          HORS_LIGNE: "true"
          ADRESSES_DOSSIERS: "false"
        run: |
          mkdocs build --site-dir /tmp/hors-ligne
          rm -f /tmp/hors-ligne/CNAME
          (cd /tmp/hors-ligne && zip -qr "$GITHUB_WORKSPACE/site/hors-ligne.zip" .)

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Téléverser le site construit
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: Publier sur GitHub Pages
        id: deploiement
        uses: actions/deploy-pages@v4
