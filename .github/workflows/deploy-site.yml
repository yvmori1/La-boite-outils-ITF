name: Déploiement du site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication à la fois, sans annuler celle déjà en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construire:
    runs-on: ubuntu-latest
    outputs:
      dernier: ${{ steps.dernier.outputs.dernier }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Construire le site
        run: mkdocs build

      # Copie du site lisible sans connexion (au dojang, par exemple) :
      # pages en .html, recherche intégrée, audio compris. Publiée en
      # hors-ligne.zip à la racine du site.
      - name: Construire la version hors ligne
        env:
          HORS_LIGNE: "true"
          ADRESSES_DOSSIERS: "false"
        run: |
          mkdocs build --site-dir /tmp/hors-ligne
          rm -f /tmp/hors-ligne/CNAME
          (cd /tmp/hors-ligne && zip -qr "$GITHUB_WORKSPACE/site/hors-ligne.zip" .)

      # Deux fusions rapprochées lancent deux publications ; si la plus
      # ancienne attend un exécuteur, elle peut finir après la plus récente et
      # remettre en ligne l'ancien site (cas du 2026-11-04). On ne publie donc
      # que si ce commit est encore le dernier de main.
      - name: Vérifier que ce commit est le dernier de main
        id: dernier
        run: |
          tete=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$tete" = "$GITHUB_SHA" ] || [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "dernier=true" >> "$GITHUB_OUTPUT"
          else
            echo "dernier=false" >> "$GITHUB_OUTPUT"
            echo "::notice::main est passé à $tete : publication laissée à son propre déploiement."
          fi

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v6

      - name: Téléverser le site construit
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  publier:
    needs: construire
    if: needs.construire.outputs.dernier == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: Publier sur GitHub Pages
        id: deploiement
        uses: actions/deploy-pages@v5
