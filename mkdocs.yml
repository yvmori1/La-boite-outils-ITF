site_name: La boîte à outils ITF
site_description: >-
  Documentation technique et théorique de Taekwon-Do ITF, en français :
  fiches de techniques, formes (Tul), théorie et passages de grade.
site_url: https://outils.hosinsul.ca/
repo_url: https://github.com/yvmori1/La-boite-outils-ITF
repo_name: La-boite-outils-ITF
edit_uri: edit/main/
copyright: La boîte à outils ITF

# Les fiches restent à la racine du dépôt. Le dossier docs/ ne contient que
# des liens symboliques vers ces dossiers, plus les fichiers propres au site.
docs_dir: docs
site_dir: site
# Version hors ligne (zip téléchargeable) : le déploiement reconstruit le site
# avec HORS_LIGNE=true, ce qui active le greffon « offline » et des adresses
# en .html lisibles sans serveur.
use_directory_urls: !ENV [ADRESSES_DOSSIERS, true]

theme:
  name: material
  # overrides/partials/nav.html : menu principal partagé (hooks/menu_partage.py)
  custom_dir: overrides
  language: fr
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.indexes
    # fil d'Ariane au-dessus du titre : partie du Manuel › section › page
    - navigation.path
    - navigation.top
    # liens « Précédent / Suivant » en bas de page : on lit le manuel découpé
    # chapitre après chapitre
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.action.edit
    # traduction des termes coréens au survol (voir includes/infobulles.md)
    - content.tooltips
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: red
      toggle:
        icon: material/weather-night
        name: Passer au thème sombre
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: red
      toggle:
        icon: material/weather-sunny
        name: Passer au thème clair

plugins:
  - search:
      lang: fr
  # Version hors ligne : désactivé sauf quand HORS_LIGNE=true.
  - offline:
      enabled: !ENV [HORS_LIGNE, false]
  # Lit docs/.pages pour l'ordre et les titres des sections du menu.
  - awesome-pages
  # Garde valides les anciennes adresses des pages déplacées.
  - redirects:
      redirect_maps:
        Theorie/Combats.md: Combat/arbitrage.md
        # L'ancienne page d'accueil de Théorie : tout est rangé dans le Manuel.
        Theorie/README.md: Theorie/manuel/README.md
        # Les longs documents de Theorie/ découpés en sous-pages : l'ancienne
        # page mène au sommaire, et docs/assets/anciennes-ancres.js envoie
        # l'ancre éventuelle (#...) vers la sous-page qui la contient.
        Theorie/manuel-taekwon-do.md: Theorie/manuel/README.md
        Theorie/examens-theoriques-taekwondo.md: Theorie/examens/README.md
        Theorie/glossaire-coreen-francais.md: Theorie/glossaire/README.md
        Theorie/programme-session.md: Theorie/programme-session/README.md
        # Positions regroupées dans sogi/, fiches en double fusionnées et
        # noms de fichiers corrigés (ancienne adresse -> fiche conservée).
        Techniques/Annun-Sogi.md: sogi/Annun-Sogi.md
        Techniques/Dwitbal-Sogi.md: sogi/Dwitbal-Sogi.md
        Techniques/Guburyo-Junbi-Sogi-A.md: sogi/Guburyo-Junbi-Sogi-A.md
        Techniques/Guburyo-Junbi-Sogi-B.md: sogi/Guburyo-Junbi-Sogi-B.md
        Techniques/Gunnun-Junbi-Sogi.md: sogi/Gunnun-Junbi-Sogi.md
        Techniques/Gunnun-Sogi.md: sogi/Gunnun-Sogi.md
        Techniques/Kyocha-Sogi.md: sogi/Kyocha-Sogi.md
        Techniques/Moa-Junbi-Sogi-B.md: sogi/Moa-Junbi-Sogi-B.md
        Techniques/Moa-Junbi-Sogi-C.md: sogi/Moa-Junbi-Sogi-C.md
        Techniques/Moa-Sogi.md: sogi/Moa-Sogi.md
        Techniques/Niunja-Sogi.md: sogi/Niunja-Sogi.md
        Techniques/Waebal-Sogi.md: sogi/Waebal-Sogi.md
        chagi/ihamyo-bandae-dollyo-chagi.md: chagi/pihamyo-bandae-dollyo-chagi.md
        chagi/twimyo-sangband-chagi.md: chagi/twimyo-sangbang-chagi.md
        Techniques/Naeryo-Chagi.md: chagi/naeryo-chagi.md
        Techniques/Moorup-Ollyo-Chagi.md: chagi/moorup-ollyo-chagi.md
        Techniques/Twimyo-Yopcha-Jirugi.md: chagi/twimyo-yopcha-jirugi.md
        Techniques/Pihamyo-Bandae-Dollyo-Chagi.md: chagi/pihamyo-bandae-dollyo-chagi.md
        Techniques/Twimyo-Sangbang-Chagi.md: chagi/twimyo-sangbang-chagi.md
        Techniques/Najunde-Ap-Cha-Busigi.md: Techniques/Najunde-Apcha-Busigi.md
        Techniques/Sonkal-Twio-Dolymyo-Taerigi.md: Techniques/Sonkal-Twio-Dolmyo-Taerigi.md
        Techniques/Guburyo-Junbi-So-B.md: sogi/Guburyo-Junbi-Sogi-B.md
        Techniques/Gunnun-Do-Dung-Joomuk-Ap-Taerigi.md: Techniques/Gunnun-So-Dung-Joomuk-Ap-Taerigi.md

# Date de la dernière mise à jour sur la page d'accueil.
hooks:
  - hooks/date_mise_a_jour.py
  # Variantes de romanisation (Dolyo, Chirugi…) dans l'index de recherche.
  - hooks/recherche_variantes.py
  # Traduction des termes coréens au survol : charge includes/infobulles.md
  # dans l'extension abbr (fichier produit par scripts/generer-infobulles.py).
  - hooks/infobulles.py
  # Menu principal rangé selon le plan du Manuel (menu.yml), après
  # awesome-pages et avant menu_partage, qui l'écrit.
  - hooks/menu_manuel.py
  # Menu principal écrit une fois dans assets/menu.html au lieu de chaque page
  # (allège le site de 180 à environ 40 Mo).
  - hooks/menu_partage.py
  # Application installable (iPhone, iPad) utilisable hors ligne : manifeste,
  # balises Apple et liste des fichiers pour le service worker (docs/sw.js).
  # En dernier : la liste doit inclure assets/menu.html, écrit juste avant.
  - hooks/pwa.py

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: "¶"
      permalink_title: Lien vers cette section
      # Ancres au format GitHub (accents conservés, « — » donne « -- »),
      # pour que les mêmes liens marchent sur GitHub et sur le site.
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  # Formules LaTeX ($...$ et $$...$$) présentes dans Theorie/.
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - assets/site.css

extra_javascript:
  - assets/menu.js
  - assets/mathjax.js
  - assets/anciennes-ancres.js
  - assets/audio.js
  - assets/quiz.js
  - assets/impression.js
  - assets/pwa.js
  # Statistiques de fréquentation sans témoins (GoatCounter), voir
  # Confidentialite.md.
  - assets/statistiques.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

# Signale les liens internes cassés pendant la construction, sans la bloquer.
validation:
  links:
    absolute_links: warn
    unrecognized_links: warn
