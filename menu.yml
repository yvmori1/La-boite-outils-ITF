# Plan du menu principal du site : le Manuel sert de colonne vertébrale.
# Lu par hooks/menu_manuel.py, qui range dans ce plan le menu construit par
# awesome-pages (docs/.pages et les .pages des sections).
#
# Chaque entrée est l'une des formes suivantes :
#   - chemin/page.md            la page, avec son titre habituel
#   - "Titre": chemin/page.md   la page, sous ce titre
#   - chemin/dossier            le contenu de la section de ce dossier, à plat
#   - "Titre": chemin/dossier   la section de ce dossier, sous ce titre
#   - "Titre": [entrées]        une section qui regroupe ces entrées
#
# Un dossier mis à plat ou en section reprend son propre menu (.pages ou
# README), sauf les pages et sous-dossiers placés ailleurs dans ce plan.
# Les fichiers ne bougent pas : seules leurs places dans le menu changent,
# leurs adresses restent les mêmes.
#
# Une page du site qui ne trouve pas de place ici est signalée à la
# construction ; ajoutez-la au plan, ou à HORS_MENU dans le hook.

